<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Concert Admin</h2>

            <nav>
                <a href="../../index.html">Dashboard</a>

                <a href="../index.html">Artist Management</a>

                <a href="#" class="active">Managers</a>
            </nav>

            <a href="../../../login/index.html" class="logout">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header>
                <div>
                    <h1>👔 Managers</h1>

                    <p>
                        Manage artist manager information.
                    </p>
                </div>

                <button id="addManagerBtn">
                    + Add Manager
                </button>
            </header>


            <!-- Manager Table -->
            <section class="table-section">

                <h2>Manager Records</h2>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Manager ID</th>
                                <th>Manager Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="managerTableBody">

                            <!-- Manager data will come here -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <!-- Add Manager Modal -->
<div class="modal" id="managerModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2>Add Manager</h2>

        <form id="managerForm">

            <label>Manager ID</label>
            <input
                type="text"
                id="managerId"
                maxlength="5"
                placeholder="e.g. MN001"
                required
            >

            <label>Manager Name</label>
            <input
                type="text"
                id="managerName"
                placeholder="Enter manager name"
                required
            >

            <label>Phone</label>
            <input
                type="text"
                id="managerPhone"
                maxlength="15"
                placeholder="Enter phone number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="managerEmail"
                placeholder="Enter email"
            >

            <button type="submit" class="save-btn">
                Add Manager
            </button>

        </form>

    </div>

</div>

    <script src="script.js"></script>

</body>

</html>
