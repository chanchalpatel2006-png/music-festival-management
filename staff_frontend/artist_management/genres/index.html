<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genre Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Concert Admin</h2>

            <nav>
                <a href="../../index.html">Dashboard</a>
                <a href="../index.html">Artist Management</a>
                <a href="#" class="active">Genres</a>
            </nav>

            <a href="../../../login/index.html" class="logout">
                Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header>

                <div>
                    <h1>🎵 Genres</h1>
                    <p>Manage music genres.</p>
                </div>

                <button id="addGenreBtn">
                    + Add Genre
                </button>

            </header>


            <!-- Genre Table -->
            <section class="table-section">

                <h2>Genre Records</h2>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Genre ID</th>
                                <th>Genre Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="genreTableBody">

                            <!-- Genre records will appear here -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- Add Genre Modal -->
    <div class="modal" id="genreModal">

        <div class="modal-content">

            <span class="close" id="closeModal">&times;</span>

            <h2>Add Genre</h2>

            <form id="genreForm">

                <label>Genre ID</label>

                <input
                    type="text"
                    id="genreId"
                    maxlength="4"
                    placeholder="e.g. G001"
                    required
                >


                <label>Genre Name</label>

                <input
                    type="text"
                    id="genreName"
                    maxlength="50"
                    placeholder="e.g. Pop"
                    required
                >


                <button type="submit" class="save-btn">
                    Add Genre
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
