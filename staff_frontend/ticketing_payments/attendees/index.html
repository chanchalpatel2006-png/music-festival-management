<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendee Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../../artist_management/index.html">Artist Management</a>
            <a href="../../event_venue/index.html">Event & Venue</a>
            <a href="../index.html">Ticketing & Payments</a>
            <a href="#" class="active">Attendees</a>
        </nav>

        <a href="../../../login/index.html" class="logout">
            Logout
        </a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header>

            <div>
                <h1>👤 Attendees</h1>
                <p>Manage attendee information and contact details.</p>
            </div>

            <button id="addAttendeeBtn">
                + Add Attendee
            </button>

        </header>


        <!-- TABLE -->
        <section class="table-section">

            <h2>Attendee Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Attendee ID</th>
                            <th>Attendee Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Age</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="attendeeTableBody">
                        <!-- Records will appear here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- ADD / EDIT ATTENDEE MODAL -->
<div class="modal" id="attendeeModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2>Add Attendee</h2>

        <form id="attendeeForm">

            <label>Attendee ID</label>

            <input
                type="text"
                id="attendeeId"
                maxlength="8"
                placeholder="e.g. AT000001"
                required
            >


            <label>Attendee Name</label>

            <input
                type="text"
                id="attendeeName"
                maxlength="50"
                placeholder="Enter attendee name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                maxlength="50"
                placeholder="example@email.com"
                required
            >


            <label>Phone</label>

            <input
                type="tel"
                id="phone"
                maxlength="15"
                placeholder="Enter phone number"
                required
            >


            <label>Age</label>

            <input
                type="number"
                id="age"
                min="15"
                step="1"
                placeholder="Minimum age is 15"
                required
            >


            <p id="formError" class="error-message"></p>


            <button type="submit" class="save-btn">
                Add Attendee
            </button>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
