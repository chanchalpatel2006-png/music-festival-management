<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../../artist_management/index.html">Artist Management</a>
            <a href="../../event_venue/index.html">Event & Venue</a>
            <a href="../index.html">Ticketing & Payments</a>
            <a href="#" class="active">Payments</a>
        </nav>

        <a href="../../../login/index.html" class="logout">
            Logout
        </a>

    </aside>


    <main class="main-content">

        <header>

            <div>
                <h1>💳 Payments</h1>
                <p>Manage ticket payments and payment status.</p>
            </div>

            <button id="addPaymentBtn">
                + Add Payment
            </button>

        </header>


        <section class="table-section">

            <h2>Payment Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Payment ID</th>
                            <th>Ticket ID</th>
                            <th>Amount</th>
                            <th>Payment Date</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="paymentTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div class="modal" id="paymentModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2>Add Payment</h2>

        <form id="paymentForm">

            <label>Payment ID</label>

            <input
                type="text"
                id="paymentId"
                maxlength="8"
                readonly
                required
            >


            <label>Ticket ID</label>

            <input
                type="text"
                id="ticketId"
                maxlength="8"
                placeholder="e.g. TK000001"
                required
            >


            <label>Amount</label>

            <input
                type="number"
                id="amount"
                min="0"
                step="0.01"
                placeholder="Enter amount"
                required
            >


            <label>Payment Date & Time</label>

            <input
                type="datetime-local"
                id="paymentDate"
                required
            >


            <label>Payment Method</label>

            <select id="paymentMethod" required>

                <option value="">Select payment method</option>
                <option value="UPI">UPI</option>
                <option value="Net Banking">Net Banking</option>
                <option value="Card">Card</option>

            </select>


            <label>Payment Status</label>

            <select id="paymentStatus" required>

                <option value="">Select payment status</option>
                <option value="Refunded">Refunded</option>
                <option value="Pending">Pending</option>
                <option value="Success">Success</option>

            </select>


            <p id="formError" class="error-message"></p>


            <button type="submit" class="save-btn">
                Add Payment
            </button>

        </form>

    </div>

</div>

<script src="../../../idGenerator.js"></script>
<script src="script.js"></script>

</body>

</html>
