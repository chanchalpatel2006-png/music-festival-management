<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Type Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../../artist_management/index.html">Artist Management</a>
            <a href="../../event_venue/index.html">Event & Venue</a>
            <a href="../index.html">Ticketing & Payments</a>
            <a href="#" class="active">Ticket Types</a>
        </nav>

        <a href="../../../login/index.html" class="logout">
            Logout
        </a>

    </aside>


    <main class="main-content">

        <header>

            <div>
                <h1>🎫 Ticket Types</h1>
                <p>Manage ticket categories, quantities and prices.</p>
            </div>

            <button id="addTicketTypeBtn">
                + Add Ticket Type
            </button>

        </header>


        <section class="table-section">

            <h2>Ticket Type Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Ticket Type ID</th>
                            <th>Type Name</th>
                            <th>Total Quantity</th>
                            <th>Available</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="ticketTypeTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div class="modal" id="ticketTypeModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2>Add Ticket Type</h2>

        <form id="ticketTypeForm">

            <label>Ticket Type ID</label>

            <input
                type="text"
                id="ticketTypeId"
                maxlength="4"
                placeholder="e.g. TT01"
                required
            >


            <label>Type Name</label>

            <select id="typeName" required>

                <option value="">Select ticket type</option>
                <option value="VIP">VIP</option>
                <option value="GENERAL">GENERAL</option>
                <option value="STUDENT">STUDENT</option>

            </select>


            <label>Total Quantity</label>

            <input
                type="number"
                id="totalQuantity"
                min="1"
                step="1"
                placeholder="Enter total quantity"
                required
            >


            <label>Available</label>

            <input
                type="number"
                id="available"
                min="0"
                step="1"
                placeholder="Enter available quantity"
                required
            >


            <label>Price</label>

            <input
                type="number"
                id="price"
                min="0"
                step="0.01"
                placeholder="Enter ticket price"
                required
            >


            <p id="formError" class="error-message"></p>


            <button type="submit" class="save-btn">
                Add Ticket Type
            </button>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
