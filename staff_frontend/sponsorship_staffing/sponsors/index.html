<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sponsor Management</title>

    <link rel="stylesheet" href="../crud.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../index.html">Sponsorships & Staffing</a>
            <a href="#" class="active">Sponsors</a>
        </nav>

        <a href="../../../login/index.html" class="logout">
            Logout
        </a>

    </aside>


    <main class="main-content">

        <header>

            <div>
                <h1>💰 Sponsors</h1>
                <p>Manage festival sponsorship information.</p>
            </div>

            <button id="addRecordBtn" class="add-btn">
                + Add Sponsor
            </button>

        </header>


        <section class="table-section">

            <h2>Sponsor Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Sponsor ID</th>
                            <th>Sponsor Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Type</th>
                            <th>Tier</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="recordTableBody"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div class="modal" id="recordModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2 id="modalTitle">Add Sponsor</h2>


        <form id="recordForm">

            <label>Sponsor ID</label>

            <input
                type="text"
                id="sponsor_id"
                maxlength="6"
                placeholder="e.g. SP0001"
                required
            >


            <label>Sponsor Name</label>

            <input
                type="text"
                id="sponsor_name"
                maxlength="50"
                required
            >


            <label>Phone</label>

            <input
                type="tel"
                id="phone"
                maxlength="15"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                maxlength="50"
                required
            >


            <label>Sponsorship Type</label>

            <select id="sponsorship_type" required>

                <option value="">Select type</option>
                <option value="Monetary">Monetary</option>
                <option value="Goods">Goods</option>
                <option value="Services">Services</option>

            </select>


            <label>Sponsorship Tier</label>

            <select id="sponsorship_tier" required>

                <option value="">Select tier</option>
                <option value="Title">Title</option>
                <option value="Platinum">Platinum</option>
                <option value="Gold">Gold</option>
                <option value="Silver">Silver</option>
                <option value="Bronze">Bronze</option>

            </select>


            <label>Sponsorship Amount</label>

            <input
                type="number"
                id="sponsorship_amount"
                min="0"
                max="9999999999.99"
                step="0.01"
                placeholder="Optional"
            >


            <p id="formError" class="error-message"></p>


            <button
                type="submit"
                id="saveBtn"
                class="save-btn"
            >
                Add Sponsor
            </button>

        </form>

    </div>

</div>


<script>

window.pageConfig = {

    name: "Sponsor",

    fields: [
        "sponsor_id",
        "sponsor_name",
        "phone",
        "email",
        "sponsorship_type",
        "sponsorship_tier",
        "sponsorship_amount"
    ],

    primaryKey: [
        "sponsor_id"
    ],

    validate: function (values) {

        if (!values.email.includes("@")) {

            return "Email must contain @.";

        }


        if (
            values.sponsorship_amount !== "" &&
            (
                Number(values.sponsorship_amount) < 0 ||
                Number(values.sponsorship_amount) > 9999999999.99
            )
        ) {

            return "Sponsorship amount must be 0 or greater.";

        }


        return "";

    }

};

</script>

<script src="../crud.js"></script>

</body>

</html>
