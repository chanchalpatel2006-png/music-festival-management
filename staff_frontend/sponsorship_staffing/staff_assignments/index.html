<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Assignments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Festival Management</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../staff/index.html">Staff</a>
            <a href="index.html" class="active">Staff Assignment</a>
            <a href="../../event_venue/performances/index.html">
                Performances
            </a>
        </nav>

        <a href="../../index.html" class="logout">Back</a>

    </aside>


    <main class="main-content">

        <header>

            <div>
                <h1>Staff Assignments</h1>

                <p>
                    Manage staff assignments for events and stages.
                </p>
            </div>

            <button class="add-btn" id="addBtn">
                + Add Assignment
            </button>

        </header>


        <section class="table-section">

            <h2>Assignment Records</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Assignment ID</th>
                            <th>Staff</th>
                            <th>Stage</th>
                            <th>Event</th>
                            <th>Shift Start</th>
                            <th>Shift End</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="tableBody"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2 id="modalTitle">Add Assignment</h2>

        <form id="recordForm">

            <input
                type="hidden"
                id="old_assignment_id"
            >


            <label for="assignment_id">
                Assignment ID
            </label>

            <input
                type="text"
                id="assignment_id"
                readonly
                required
            >


            <label for="staff_id">
                Staff
            </label>

            <select id="staff_id" required>

                <option value="">
                    Select Staff
                </option>

            </select>


            <label for="stage_id">
                Stage
            </label>

            <select id="stage_id">

                <option value="">
                    No Stage
                </option>

            </select>


            <label for="event_id">
                Event
            </label>

            <select id="event_id" required>

                <option value="">
                    Select Event
                </option>

            </select>


            <label for="shift_start">
                Shift Start
            </label>

            <input
                type="datetime-local"
                id="shift_start"
                required
            >


            <label for="shift_end">
                Shift End
            </label>

            <input
                type="datetime-local"
                id="shift_end"
                required
            >


            <div
                class="error-message"
                id="errorMessage"
            ></div>


            <button
                type="submit"
                class="save-btn"
            >
                Save Assignment
            </button>

        </form>

    </div>

</div>

<script src="../../../idGenerator.js"></script>
<script src="script.js"></script>

</body>
</html>
