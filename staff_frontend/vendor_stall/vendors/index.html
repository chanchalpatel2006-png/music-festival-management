<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../../artist_management/index.html">Artist Management</a>
            <a href="../../event_venue/index.html">Event & Venue</a>
            <a href="../../ticketing_payments/index.html">Ticketing & Payments</a>
            <a href="../index.html">Vendor & Stall</a>
            <a href="#" class="active">Vendors</a>
        </nav>

        <a href="../../../login/index.html" class="logout">Logout</a>
    </aside>

    <main class="main-content">

        <header>
            <div>
                <h1>🏪 Vendors</h1>
                <p>Manage vendor information and business details.</p>
            </div>

            <button id="addRecordBtn" class="add-btn">+ Add Vendor</button>
        </header>

        <section class="table-section">
            <h2>Vendor Records</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Vendor ID</th>
                            <th>Vendor Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Vendor Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="recordTableBody"></tbody>
                </table>
            </div>
        </section>

    </main>

</div>

<div class="modal" id="recordModal">
    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>
        <h2 id="modalTitle">Add Vendor</h2>

        <form id="recordForm">

            <label>Vendor ID</label>
            <input type="text" id="vendor_id"
                   maxlength="5" readonly required>

            <label>Vendor Name</label>
            <input type="text" id="vendor_name"
                   maxlength="50" required>

            <label>Phone</label>
            <input type="tel" id="phone"
                   maxlength="15" required>

            <label>Email</label>
            <input type="email" id="email"
                   maxlength="50" required>

            <label>Vendor Type</label>
            <select id="vendor_type" required>
                <option value="">Select vendor type</option>
                <option value="Sponsor">Sponsor</option>
                <option value="Business">Business</option>
            </select>

            <p id="formError" class="error-message"></p>

            <button type="submit" id="saveBtn" class="save-btn">
                Add Vendor
            </button>

        </form>
    </div>
</div>

<script>
window.pageConfig = {
    name: "Vendor",

    fields: [
        "vendor_id",
        "vendor_name",
        "phone",
        "email",
        "vendor_type"
    ],

    validate: function (values) {
        if (!values.email.includes("@")) {
            return "Email must contain @.";
        }

        return "";
    }
};
</script>

<script src="../../../idGenerator.js"></script>
<script src="script.js"></script>

</body>
</html>
