<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Setlist Song Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h2>Concert Admin</h2>

            <nav>
                <a href="../../index.html">Dashboard</a>
                <a href="../../artist_management/index.html">Artist Management</a>
                <a href="../index.html">Event & Venue</a>
                <a href="#" class="active">Setlist Songs</a>
            </nav>

            <a href="../../../login/index.html" class="logout">
                Logout
            </a>

        </aside>


        <main class="main-content">

            <header>

                <div>
                    <h1>🎶 Setlist Songs</h1>
                    <p>Assign songs and their order to setlists.</p>
                </div>

                <button id="addSetlistSongBtn">
                    + Add Setlist Song
                </button>

            </header>


            <section class="table-section">

                <h2>Setlist Song Records</h2>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Setlist ID</th>
                                <th>Song</th>
                                <th>Song Order</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="setlistSongTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- MODAL -->

    <div class="modal" id="setlistSongModal">

        <div class="modal-content">

            <span class="close" id="closeModal">&times;</span>

            <h2>Add Setlist Song</h2>

            <form id="setlistSongForm">

                <label>Setlist ID</label>

                <input type="text" id="setlistId" maxlength="6" placeholder="e.g. SL0001" required>


                <label>Song</label>

                <select id="songId" required>
                    <option value="">Select Song</option>
                </select>


                <label>Song Order</label>

                <input type="number" id="songOrder" min="1" step="1" placeholder="e.g. 1" required>


                <p id="formError" class="error-message"></p>


                <button type="submit" class="save-btn">
                    Add Setlist Song
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
