<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Setlist Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <h2>Concert Admin</h2>

        <nav>
            <a href="../../index.html">Dashboard</a>
            <a href="../../artist_management/index.html">Artist Management</a>
            <a href="../index.html">Event & Venue</a>
            <a href="#" class="active">Setlists</a>
        </nav>

        <a href="../../../login/index.html" class="logout">
            Logout
        </a>

    </aside>


    <main class="main-content">

        <header>

            <div>
                <h1>📋 Setlists</h1>
                <p>Manage setlists assigned to performances.</p>
            </div>

            <button id="addSetlistBtn">
                + Add Setlist
            </button>

        </header>


        <section class="table-section">

            <h2>Setlist Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Setlist ID</th>
                            <th>Performance ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="setlistTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div class="modal" id="setlistModal">

    <div class="modal-content">

        <span class="close" id="closeModal">&times;</span>

        <h2>Add Setlist</h2>

        <form id="setlistForm">

            <label>Setlist ID</label>

            <input
                type="text"
                id="setlistId"
                maxlength="6"
                placeholder="e.g. SL0001"
                required
            >


            <label>Performance ID</label>

            <input
                type="text"
                id="performanceId"
                maxlength="6"
                placeholder="e.g. PF0001"
                required
            >


            <button type="submit" class="save-btn">
                Add Setlist
            </button>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
