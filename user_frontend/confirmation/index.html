<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | Festivo</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

    <a href="../index.html" class="logo">
        🎵 Festivo
    </a>

</nav>


<main>


    <!-- SUCCESS MESSAGE -->

    <div class="success">

        <div class="check">
            ✓
        </div>

        <span>STEP 3 OF 3</span>

        <h1>You're Going!</h1>

        <p>
            Your booking has been successfully confirmed.
        </p>

    </div>


    <!-- DIGITAL TICKET -->

    <section class="ticket">


        <!-- TICKET HEADER -->

        <div class="ticket-top">

            <div>

                <span>FESTIVO • ADMIT ONE</span>

                <h2 id="eventName"></h2>

            </div>


            <div class="ticket-type" id="ticketType"></div>

        </div>


        <!-- TICKET DETAILS -->

        <div class="ticket-body">


            <!-- ATTENDEE -->

            <div>

                <small>ATTENDEE</small>

                <strong id="attendeeName"></strong>

            </div>


            <!-- SELECTED FESTIVAL DATE -->

            <div>

                <small>DATE</small>

                <strong id="eventDate"></strong>

            </div>


            <!-- GATES OPEN -->

            <div>

                <small>GATES OPEN AT</small>

                <strong id="eventTime"></strong>

            </div>


            <!-- VENUE -->

            <div>

                <small>VENUE</small>

                <strong id="eventVenue"></strong>

            </div>


            <!-- AMOUNT -->

            <div>

                <small>AMOUNT PAID</small>

                <strong id="amount"></strong>

            </div>


            <!-- GATES CLOSE -->

            <div>

                <small>GATES CLOSE AT</small>

                <strong id="eventStage"></strong>

            </div>


        </div>


        <!-- PAYMENT / STATUS / TICKET ID -->

        <div class="ticket-bottom">


            <div>

                <small>PAYMENT</small>

                <strong id="paymentMethod"></strong>

            </div>


            <div>

                <small>STATUS</small>

                <strong class="active-status">
                    ACTIVE
                </strong>

            </div>


            <div class="ticket-code">

                <small>TICKET ID</small>

                <strong id="ticketId"></strong>

            </div>


        </div>


    </section>


    <!-- ACTION BUTTONS -->

    <div class="actions">


        <a href="../events/index.html"
           class="secondary">

            Explore More Events

        </a>


        <a href="../index.html"
           class="primary">

            Back to Home

        </a>


    </div>


</main>


<script src="script.js"></script>


</body>

</html>
