<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | Festivo</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

    <a href="../index.html" class="logo">
        🎵 Festivo
    </a>

</nav>


<main>


    <div class="success">

        <div class="check">
            ✓
        </div>

        <span>STEP 3 OF 3</span>

        <h1>You're Going!</h1>

        <p>
            Your booking has been successfully confirmed.
        </p>

    </div>


    <section class="ticket">


        <div class="ticket-top">

            <div>

                <span>FESTIVO • ADMIT ONE</span>

                <h2 id="eventName"></h2>

            </div>


            <div class="ticket-type"
                 id="ticketType">
            </div>

        </div>


        <div class="ticket-body">


            <div>

                <small>ATTENDEE</small>

                <strong id="attendeeName"></strong>

            </div>


            <div>

                <small>DATE</small>

                <strong id="eventDate"></strong>

            </div>


            <div>

                <small>TIME</small>

                <strong id="eventTime"></strong>

            </div>


            <div>

                <small>VENUE</small>

                <strong id="eventVenue"></strong>

            </div>


            <div>

                <small>STAGE</small>

                <strong id="eventStage"></strong>

            </div>


            <div>

                <small>AMOUNT PAID</small>

                <strong id="amount"></strong>

            </div>


        </div>


        <div class="ticket-bottom">

            <div>

                <small>PAYMENT</small>

                <strong id="paymentMethod"></strong>

            </div>


            <div>

                <small>STATUS</small>

                <strong class="active-status">
                    ACTIVE
                </strong>

            </div>


            <div class="ticket-code">

                <small>TICKET ID</small>

                <strong id="ticketId"></strong>

            </div>

        </div>


    </section>


    <div class="actions">

        <a href="../events/index.html"
           class="secondary">

            Explore More Events

        </a>


        <a href="../index.html"
           class="primary">

            Back to Home

        </a>

    </div>


</main>


<script src="script.js"></script>

</body>

</html>
